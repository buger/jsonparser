id: KI-4
title: Set on top-level array-index beyond length returns KeyPathNotFoundError instead of appending
description: SYS-REQ-110 unconditionally requires append-at-end for [N] where N >= len(array), but Set's top-level branch explicitly rejects matching array+array-index paths with KeyPathNotFoundError. Nested arrays are fixed (DEFECT-260727-WWWY); only top-level arrays are affected.
affected_requirements:
    - SYS-REQ-110
evidence_manifests:
    - proof/evidence/ki4-set-toplevel-array-beyond-length.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Set
attacker_input: Caller-controlled path [N] where N >= len(top-level array)
reproducer_command: go test -v -run TestSetTopLevelArrayAppend_KI4 -count=1 ./...
introduced_in: inception
mitigation: Wrap the top-level array in an object (e.g. {"items":[...]}), or append manually by re-slicing.
remediation: Extend parser.go:Set endOffset==-1 branch to handle (pathIsIndex && dataIsArray) top-level arrays, OR narrow SYS-REQ-110 to document the top-level exception.
customer_impact: Set fails for a common use case (appending to a top-level JSON array); callers must wrap the array in an object.
owner: human:buger
review_date: "2026-08-15"
release_disposition: fixed
status: fixed
fix: 'parser.go:Set endOffset==-1 branch now handles top-level (pathIsIndex && dataIsArray) paths: when a [N] index is missing on a top-level array, Set appends at the array end (and cleans a trailing comma if present), matching SYS-REQ-110 nested-array behavior. Regression test parser_test.go:TestSetTopLevelArrayAppend_KI4 covers append-beyond-length, append-to-empty, in-range replace, and trailing-comma cleanup.'
fixed_behavior: |
    Set (parser.go) now appends to a top-level array when the path is an
    array-index ([N]) with N >= len(array), instead of returning
    KeyPathNotFoundError. The endOffset==-1 branch detects
    (pathIsIndex && dataIsArray) at the top level, computes the array
    close bracket, and routes through the same insert/append machinery
    used for nested arrays (parser.go:1407-1436). A trailing comma in a
    malformed array (e.g. `[1,2,]`) is cleaned up during the append.
    In-range index replacement ([0], [1] on a top-level array) is
    unchanged. Witnessed by parser_test.go:TestSetTopLevelArrayAppend_KI4
    (5 subtests: append beyond length, append to empty, replace index
    zero, replace index one, append cleans trailing comma).
