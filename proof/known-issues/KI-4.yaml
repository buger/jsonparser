id: KI-4
title: Set on top-level array-index beyond length returns KeyPathNotFoundError instead of appending
description: SYS-REQ-110 unconditionally requires append-at-end for [N] where N >= len(array), but Set's top-level branch explicitly rejects matching array+array-index paths with KeyPathNotFoundError. Nested arrays are fixed (DEFECT-260727-WWWY); only top-level arrays are affected.
affected_requirements:
    - SYS-REQ-110
evidence_manifests:
    - proof/evidence/ki4-set-toplevel-array-beyond-length.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Set
attacker_input: Caller-controlled path [N] where N >= len(top-level array)
reproducer_command: go test -v -run TestSetTopLevelArrayBeyondLength_KI4 -count=1 ./...
introduced_in: inception
mitigation: Wrap the top-level array in an object (e.g. {"items":[...]}), or append manually by re-slicing.
remediation: Extend parser.go:Set endOffset==-1 branch to handle (pathIsIndex && dataIsArray) top-level arrays, OR narrow SYS-REQ-110 to document the top-level exception.
customer_impact: Set fails for a common use case (appending to a top-level JSON array); callers must wrap the array in an object.
