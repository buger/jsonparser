id: KI-3
title: Set with array-index path component under an object parent produces malformed JSON output
description: 'When Set is called with a key path that contains an array-index component ([N]) whose parent in the addressed JSON is an OBJECT rather than an array, the implementation emits malformed JSON output and returns it with a nil error. Examples (all currently produce invalid JSON, err=nil):  Set({"a":{"b":1}}, 9, "a", "[5]") -> {"a":{"b":1,9}}  Set({"a":{"b":1}}, 9, "a", "[0]", "x") -> {"a":{"b":1,{"x":9}}}  Set({"a":1}, 9, "[0]") -> {"a":1,9}. Root cause: createInsertComponent (parser.go:756) with isIndex=true, comma=true, object=false emits only ",<value>" (no quoted object key), so the value is spliced into the object body where JSON requires a "key":value pair. Set (parser.go:1018-1038) does not reject the cross-type path before invoking createInsertComponent.'
affected_requirements:
    - SYS-REQ-009
    - SYS-REQ-110
    - SYS-REQ-112
commands:
    - go test -v -run TestSetArrayIndexUnderObjectMalformedJSON_KI3 ./...
evidence_manifests:
