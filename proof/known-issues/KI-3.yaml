severity: high
severity_basis: reproducer
risk: data_integrity
cve_surface: unlikely
affected_api: Set
attacker_input: caller-supplied key path containing [N] component under an object parent (variadic ...string keys argument)
sanitizer: audit:hazard-sweep
reproducer_command: go test -v -run TestSetArrayIndexUnderObjectMalformedJSON_KI3 ./...
tripwire_mutation: Add a type-mismatch guard in parser.go:Set (around lines 1018-1038) that returns KeyPathNotFoundError when the trailing path component is an array-index ([N]) but the resolved subpath parent is an object; set_spec_test.go:TestSetArrayIndexUnderObjectMalformedJSON_KI3 flips from PASS (output fails json.Unmarshal) to FAIL (Set returns a typed error), at which point KI-3 must be re-classified as fixed.
introduced_in: inception
disclosure: public
minimization_status: minimized
mitigation: No mitigation in code; users must avoid mixing array-index path components ([N]) with object-typed parents in Set key paths. Validation in upstream callers (e.g. JSON-Schema validators) can reject such paths before they reach jsonparser.Set.
remediation: 'Add a type-mismatch guard in parser.go:Set (around lines 1018-1038): when the resolved subpath parent is an object and the trailing key is an array-index (or vice-versa), return KeyPathNotFoundError instead of invoking createInsertComponent. Alternative: reject in createInsertComponent when isIndex mismatches the parent context.'
owner: human:buger
review_date: "2026-07-26"
release_disposition: ship_with_known_issue
status: fixed
fix: parser.go:Set (auto-coerce container type, parser.go:1045-1130); regression tests set_spec_test.go:TestSetAutoCoerce_KI3, TestSetArrayIndexUnderObjectMalformedJSON_KI3 (flipped to assert valid JSON)
fixed_behavior: |
    AUTO-COERCE container type. When a path component expects one container
    type but the existing structure is the other, Set replaces the mismatched
    container at that position with a fresh container of the type the path
    expects, then proceeds with the normal (append/replace) insertion logic.
      * Path [N] (array index) under an OBJECT parent -> the object is replaced
        with an array; e.g. Set({}, 9, "[5]") -> [9]; Set({"a":{}}, 9, "a", "[5]") -> {"a":[9]}.
      * Path key (object key) under an ARRAY parent -> the array is replaced
        with an object; e.g. Set([], 9, "key") -> {"key":9}; Set({"a":[]}, 9, "a", "key") -> {"a":{"key":9}}.
    Behavior for type-MATCHING paths is unchanged. The degenerate empty-string
    key on a non-object root still returns KeyPathNotFoundError (SYS-REQ-111
    no-path outcome preserved). The output of every non-erroring Set call is
    valid JSON (json.Valid == true). Witnessed by TestSetAutoCoerce_KI3 and by
    flipping TestSetArrayIndexUnderObjectMalformedJSON_KI3 to assert valid
    output. FuzzJSONStructureAware (Set output-validity gate) passes with 0
    crashes over 2.27M execs.
