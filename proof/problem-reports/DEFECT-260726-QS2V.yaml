id: DEFECT-260726-QS2V
title: Empty-string key path component panics (hazard-sweep finding)
introduced_in: inception
source:
    type: audit_finding
    reference: 'hazard-sweep: panic_free_input_handling'
classification:
    defect_class: missing_validation
    surface: security_behavior
    severity: high
    security_relevant: true
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
        The security/hazard-sweep role identified the same panic bug class as the
        OSS-Fuzz Delete panic (caller-controlled input -> unguarded `[]` index),
        but on the path side. Every fuzz harness hardcodes non-empty path strings,
        so the empty-string key component partition was never exercised. Six
        unguarded `keys[i][0]` / `p[level][0]` dereference sites in searchKeys,
        EachKey, createInsertComponent, and calcAllocateSpace panicked with
        `runtime error: index out of range [0] with length 0` when a caller
        passed an empty-string path component. The correct `len(...) > 0` guard
        pattern already existed in Delete (parser.go:835) but was not applied
        consistently to the other dereference sites.
