            - empty_key_path_test.go:TestGetEmptyKeyPathComponent
            - empty_key_path_test.go:TestTypedGetEmptyKeyPathComponent
            - empty_key_path_test.go:TestEachKeyEmptyKeyPathComponent
            - empty_key_path_test.go:TestSetEmptyKeyPathComponent
            - empty_key_path_test.go:TestDeleteEmptyKeyPathComponent
        related_known_issues:
            - KI-1
            # KI-3 also affects SYS-REQ-009 (different failure mode:
            # cross-type Set corruption, filed 2026-07-26 as
            # DEFECT-260726-MFPA). Listed here for the cross-issue
            # alignment check; QS2V's own closure is for the empty-key
            # panic only, which KI-1 tracks.
            - KI-3
    reviewer: human:buger
    reviewed_at: "2026-07-26T15:10:00Z"
    resolution_note: |
        Fixed. The existing Delete-style `len(...) > 0` guard was applied to all
        seven unguarded `keys[i][0]` / `p[level][0]` dereference sites
        (empty-key guard at parser.go:410,616,722,744,755,773,796). Regression
        coverage in empty_key_path_test.go locks the panic-free degradation:
        an empty-string key component now surfaces a typed not-found outcome
        (or, for Set, a defined document) rather than an index-out-of-range
        panic. The linked KnownIssue KI-1 is status: fixed (same change).
