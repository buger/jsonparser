description: |
    A blind discovery pass (hazard-sweep for the `panic_free_input_handling`
    obligation class) found that passing `""` as a path component to any of
    `Get`, `GetString`, `GetInt`, `GetFloat`, `GetBoolean`, `GetUnsafeString`,
    `EachKey`, `Set`, or `Delete` crashed the goroutine with
    `runtime error: index out of range [0] with length 0` because the path-side
    code indexed `keys[i][0]` / `p[level][0]` without first checking that the
    component string was non-empty.

    Verified reproducers (pre-fix):
      Get([]byte(`[1,2,3]`), "")                  // PANIC parser.go:409 (searchKeys)
      Get([]byte(`{"a":[1]}`), "a", "")           // PANIC parser.go:409 (searchKeys)
      EachKey([]byte(`[1,2,3]`), cb, []string{""})// PANIC parser.go:614
      Set([]byte(`{}`), []byte("v"), "")          // PANIC parser.go:719 (createInsertComponent)

    The root cause is identical in shape to the OSS-Fuzz Delete panic fixed
    earlier: a caller-controlled byte reaches an unguarded slice index. The fix
    pattern (`len(...) > 0 && ...[0] == "["`) already existed in Delete and has
    now been applied to all seven remaining dereference sites. The hazard is
    FIXED in this same change; the linked KnownIssue KI-260726-001 records the
    fixed state and the regression tests in empty_key_path_test.go.
disposition:
    status: covered_by_requirement
    owner: human:buger
    requirements:
        - SYS-REQ-016
        - SYS-REQ-008
