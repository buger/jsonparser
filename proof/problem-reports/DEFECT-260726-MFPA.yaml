    evidence:
        verified_by:
            - set_spec_test.go:TestSetAutoCoerce_KI3
            - set_spec_test.go:TestSetArrayIndexUnderObjectMalformedJSON_KI3
        related_known_issues:
            - KI-3
    reviewer: human:buger
    reviewed_at: "2026-07-26T19:40:00Z"
    resolution_note: |
        FIXED: Set now auto-coerces the container type when a cross-type
        path is encountered (parser.go:1045-1130). KI-3 status flipped to
        fixed. The malformed_input obligation on SYS-REQ-009 enforces the
        no-malformed-output invariant henceforth.
        observable: PASSES while the bug is present (output fails JSON
        parse), FAILS the moment a guard lands and Set returns a typed
        error.
