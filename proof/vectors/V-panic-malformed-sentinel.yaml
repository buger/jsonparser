id: V-panic-malformed-sentinel
title: Malformed JSON and unchecked sentinel-value panic sweep
description: Hunt for panics caused by adversarial malformed JSON (e.g. {"a":,}) driving unchecked dereferences, and for callers of tokenEnd/stringEnd/blockEnd/nextToken that use the -1 or len(data) sentinel as an array index without bounds re-checking. The OSS-Fuzz Delete panic class is the canonical example. Covered by FuzzDeleteNative, FuzzGetNative in fuzz_native_test.go and sentinel regression tests in deep_spec_test.go.
priority: P0
status: closed-null
related_obligation_classes:
    - malformed_input
    - sentinel_value_boundary
stacks:
    - go
close_note: Hunted. Worst case (adversarial malformed JSON or a -1/len(data) sentinel from tokenEnd/stringEnd/blockEnd/nextToken used as an array index without bounds re-check) covered by FuzzDeleteNative + FuzzTokenStartNative (fuzz_native_test.go) and sentinel regression in deep_spec_test.go. The canonical OSS-Fuzz Delete panic class is fixed. Campaign saturated, 0 crashes on this class. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus targeted regression tests.
    evidence:
        - FuzzDeleteNative + FuzzTokenStartNative in fuzz_native_test.go drive the Delete/Get tokenization surface over libFuzzer-generated bytes (the OSS-Fuzz surface).
        - Sentinel regression tests in deep_spec_test.go pin the post-fix behavior for tokenEnd/stringEnd/blockEnd/nextToken returning -1 or len(data).
    finding: Worst case is a -1/len(data) sentinel from a boundary helper used as an array index without a bounds re-check. The canonical OSS-Fuzz Delete panic (caller-controlled byte -> unguarded [] index) is fixed and the bounds-check pattern is applied consistently. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
