id: V-error-propagation-callback
title: Callback and internal error propagation sweep in traversal and mutation
description: Hunt for cases where ArrayEach/ObjectEach/EachKey swallow a callback-returned error and continue iterating on stale offset state (callback_error_propagation), and where Set/Delete discard an internalGet error and proceed with invalid offsets causing data[:-1] or negative-index panics (error_propagation). Covered by FuzzSetNative, FuzzDeleteNative, FuzzArrayEachNative in fuzz_native_test.go and error-propagation regression tests in deep_spec_test.go.
priority: P0
status: closed-null
related_obligation_classes:
    - callback_error_propagation
    - error_propagation
stacks:
    - go
close_note: Hunted. Worst case (ArrayEach/ObjectEach/EachKey swallow a callback-returned error and continue on stale offset; Set/Delete discard an internalGet error and proceed with invalid offsets -> data[:-1] or negative-index panic) covered by FuzzSetNative, FuzzDeleteNative, FuzzObjectEachNative (fuzz_native_test.go) and error-propagation regression in deep_spec_test.go (TestDeleteErrorPropagation + ArrayEach/ObjectEach truncation and error tests). Campaign saturated, 0 crashes on this class. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus error-propagation regression tests.
    evidence:
        - FuzzSetNative, FuzzDeleteNative, FuzzObjectEachNative in fuzz_native_test.go drive the Set/Delete/traversal surfaces over libFuzzer-generated bytes.
        - Error-propagation regression in deep_spec_test.go (TestDeleteErrorPropagation plus ArrayEach/ObjectEach truncation and error tests) pins that callback errors halt iteration and internalGet errors abort mutation.
    finding: Worst case is ArrayEach/ObjectEach/EachKey swallowing a callback-returned error and continuing on a stale offset, or Set/Delete discarding an internalGet error and proceeding with invalid offsets (data[:-1] / negative-index panic). Callback errors now propagate and abort; internalGet errors short-circuit mutation. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
