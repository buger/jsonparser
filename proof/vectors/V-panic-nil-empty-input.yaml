close_note: Hunted. Worst case (nil/zero-length input -> getType data[offset] dereference panic across Get/GetString/GetUnsafeString/GetInt/GetFloat/GetBoolean/ArrayEach/ObjectEach/EachKey/Set/Delete/Parse*) covered by FuzzTokenStartNative, FuzzGetStringNative, FuzzObjectEachNative (fuzz_native_test.go), TestPropertyNoPanicOnArbitraryBytes in property_test.go (drives ArrayEach/ObjectEach/EachKey on arbitrary bytes), and nil-safety regression in obligation_property_test.go. Campaign saturated, 0 crashes on this class. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus nil/empty-input regression tests.
    evidence:
        - FuzzTokenStartNative, FuzzGetStringNative, FuzzObjectEachNative in fuzz_native_test.go drive the Get/GetString/ObjectEach surfaces over libFuzzer-generated bytes.
        - TestPropertyNoPanicOnArbitraryBytes in property_test.go drives ArrayEach/ObjectEach/EachKey/Set/Delete/Parse* on nil and arbitrary bytes.
        - Nil-safety regression in obligation_property_test.go pins the panic-free empty/nil degradation.
    finding: Worst case is a nil or zero-length []byte reaching a getType data[offset] dereference. Every entry point guards empty input before indexing. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
