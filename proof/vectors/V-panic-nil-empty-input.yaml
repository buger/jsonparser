id: V-panic-nil-empty-input
title: Nil and empty input panic sweep across all parser entry points
description: Hunt for nil-slice and zero-length input panics in Get, GetString, GetUnsafeString, GetInt, GetFloat, GetBoolean, ArrayEach, ObjectEach, EachKey, Set, Delete, and Parse* helpers. The worst case is a getType data[offset] dereference panic on nil/empty []byte. Covered by FuzzGetNative, FuzzGetStringNative, FuzzArrayEachNative in fuzz_native_test.go and nil-safety regression tests in obligation_property_test.go.
priority: P0
status: closed-null
