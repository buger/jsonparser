id: V-panic-no-path-mutation
title: Empty key-path panic sweep in Set and Delete mutation helpers
description: Hunt for panics when Set or Delete is called with zero key-path segments. The early-return guard must fire; if it regresses the next data[keys[lk-1][0]] dereference panics on the empty keys slice with index-out-of-range. Covered by FuzzSetNative, FuzzDeleteNative in fuzz_native_test.go and no-path regression tests in empty_key_path_test.go.
priority: P0
status: closed-null
related_obligation_classes:
    - no_path_provided
stacks:
    - go
close_note: Hunted. Worst case (zero-segment key path -> data[keys[lk-1][0]] index-out-of-range) covered by FuzzSetNative + FuzzDeleteNative (fuzz_native_test.go) and no-path regression in empty_key_path_test.go; run_fuzz_campaign.sh 4-pass x 180s campaign saturated with 0 crashes on this class after the empty-key guard fix. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus targeted property + regression tests.
    evidence:
        - FuzzSetNative, FuzzDeleteNative in fuzz_native_test.go drive the Set/Delete mutation entry points over libFuzzer-generated bytes (the OSS-Fuzz surface).
        - Empty-key / no-path regression in empty_key_path_test.go pins the post-fix panic-free degradation (KeyPathNotFoundError / unchanged payload instead of index-out-of-range).
    finding: Worst case is a zero-segment key path reaching the data[keys[lk-1][0]] dereference. The `len(keys) > 0` early-return guard added in the empty-key fix routes the no-path case to the existing not-found / unchanged-payload path. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
