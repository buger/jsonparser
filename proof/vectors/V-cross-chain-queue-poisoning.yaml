id: V-cross-chain-queue-poisoning
title: Cross-chain channel isolation and settlement-failure progress
description: |
    Enumerate inbound bridge queues and terminal settlement legs with their source-chain, remote-sender, destination-application, nonce, recipient, token, and paired-custody keys. Inject wrong-sender and malformed packets, a reverting destination, and a frozen or restricted final recipient before valid traffic; follow dequeue, authentication, rollback, retry, skip, quarantine, cancel, refund, and unwind behavior to prove one unprocessable head or terminal transfer failure cannot freeze unrelated messages or strand either value leg. Measure producer arrival rate, destination service rate, and retention under sustained backlog; pruning must never discard work that lacks a durable processed checkpoint.
