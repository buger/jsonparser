id: V-panic-encoding-partial-literal
title: Invalid UTF-8 encoding and partial-boolean-literal panic sweep
description: Hunt for panics and silent corruption from invalid UTF-8 passed through Unescape in ParseString/GetString (encoding_safety), and from truncated boolean literals (tru/fals) fed to ParseBoolean/GetBoolean where the partial-literal recovery path can panic on a short slice (partial_literal). Covered by FuzzParseStringNative, FuzzParseBooleanNative in fuzz_native_test.go and encoding/partial-literal tests in escape_test.go and parser_test.go.
priority: P0
status: closed-null
related_obligation_classes:
    - encoding_safety
    - partial_literal
stacks:
    - go
close_note: Hunted. Worst case (invalid UTF-8 passed through Unescape in ParseString/GetString; truncated boolean literals tru/fals fed to ParseBoolean/GetBoolean where partial-literal recovery panics on a short slice) covered by FuzzParseStringNative + FuzzParseBoolNative (fuzz_native_test.go) and encoding/partial-literal regression in escape_test.go and deep_spec_test.go (ParseBoolean/GetBoolean partial-literal cases). Campaign saturated, 0 crashes on this class. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus encoding/partial-literal regression tests.
    evidence:
        - FuzzParseStringNative + FuzzParseBoolNative in fuzz_native_test.go drive the ParseString/ParseBoolean surfaces over libFuzzer-generated bytes.
        - Encoding/partial-literal regression in escape_test.go and deep_spec_test.go (ParseBoolean/GetBoolean partial-literal cases) pins that invalid UTF-8 and truncated boolean literals surface a typed error rather than panicking.
    finding: Worst case is invalid UTF-8 passed through Unescape in ParseString/GetString, or truncated boolean literals (tru/fals) whose partial-literal recovery path panics on a short slice. Both now return a MalformedValueError. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
