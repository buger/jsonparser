id: V-panic-empty-key-component
title: Empty-string key path component panic sweep across Get/Set/Delete/EachKey
description: |
    Hunt for panics when any key path component is the empty string. An empty-string component is neither a valid object key nor the [ array-index marker; previously it reached the unguarded `keys[i][0]` / `p[level][0]` dereference sites in searchKeys, EachKey, createInsertComponent, and calcAllocateSpace and panicked with `runtime error: index out of range [0] with length 0` (OSS-Fuzz 4649128545288192 / hazard-sweep class, DEFECT-260726-QS2V, KI-1). The contract pinned by SYS-REQ-111 is panic-free degradation: KeyPathNotFoundError (Get family / Delete) or a defined error / unchanged payload (Set). Covered by FuzzGetNative, FuzzSetNative, FuzzDeleteNative in fuzz_native_test.go and the empty-key-component regression matrix in empty_key_path_test.go.
priority: P0
status: closed-null
related_obligation_classes:
    - missing_path
    - nil_safety
    - no_path_provided
stacks:
    - go
close_note: |
    Hunted. Worst case (empty-string key component -> unguarded `keys[i][0]` / `p[level][0]` index-out-of-range [0] with length 0 panic across Get/GetString/GetInt/GetFloat/GetBoolean/GetUnsafeString/EachKey/Set/Delete) covered by FuzzGetNative + FuzzSetNative + FuzzDeleteNative (fuzz_native_test.go) and the empty-key-component regression matrix in empty_key_path_test.go (TestGetEmptyKeyPathComponent, TestTypedGetEmptyKeyPathComponent, TestEachKeyEmptyKeyPathComponent, TestSetEmptyKeyPathComponent, TestDeleteEmptyKeyPathComponent). The `len(keys[i]) > 0` / `len(p[level]) > 0` guard pattern added in the empty-key fix routes the empty component through the existing not-found / no-callback / unchanged-payload path. Campaign saturated, 0 crashes on this class after the fix. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus the targeted empty-key-component regression matrix.
    evidence:
        - FuzzGetNative, FuzzSetNative, FuzzDeleteNative in fuzz_native_test.go drive the Get/Set/Delete entry points and their internal searchKeys / createInsertComponent paths over libFuzzer-generated bytes (the OSS-Fuzz surface).
        - Empty-key-component regression matrix in empty_key_path_test.go pins the post-fix panic-free degradation (KeyPathNotFoundError / typed not-found / no EachKey callback / unchanged Set or Delete payload) for empty-component-on-array-root, empty-component-on-object-root, empty-after-valid-key, empty-before-valid-key, and two-empty-components shapes.
        - Reference oracle TestOracleSetRoundTrip / TestOracleSetPr286Regression in reference_oracle_test.go witness the Set side of the same hazard class (out-of-range / degenerate path).
    finding: Worst case is an empty-string key component reaching the unguarded `keys[i][0]` or `p[level][0]` dereference in searchKeys / EachKey / createInsertComponent / calcAllocateSpace, crashing the goroutine with `index out of range [0] with length 0` on caller-controlled input (OSS-Fuzz 4649128545288192, DEFECT-260726-QS2V, KI-1). The empty-component guard added in the empty-key fix routes every entry point through the existing not-found / no-callback / unchanged-payload path. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
