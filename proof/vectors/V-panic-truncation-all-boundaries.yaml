id: V-panic-truncation-all-boundaries
title: Truncated-JSON panic sweep across value, key, structure, element, and escape boundaries
description: 'Hunt for panics on truncated JSON at every structural boundary: value-boundary (e.g. {"a": with no value), mid-key (e.g. {"key with no close), mid-structure (e.g. {"a":[1,2 with no close), mid-element (e.g. [1,"abc with no close string), and truncated escape (e.g. abc\u31 with insufficient hex digits). Each drives a nextToken/stringEnd/blockEnd to -1 whose subsequent data[offset] dereference can panic. Covered by FuzzGetNative, FuzzDeleteNative, FuzzParseStringNative in fuzz_native_test.go and truncation regression tests in deep_spec_test.go.'
priority: P0
status: closed-null
related_obligation_classes:
    - truncated_at_value_boundary
    - truncated_mid_key
    - truncated_mid_structure
    - truncated_mid_element
    - truncated_escape_sequence
stacks:
    - go
close_note: Hunted. Worst case (truncated JSON at value/key/structure/element/escape boundary -> nextToken/stringEnd/blockEnd returns -1 whose data[offset] dereference can panic) covered by FuzzTokenStartNative, FuzzDeleteNative, FuzzParseStringNative (fuzz_native_test.go) and truncation regression in deep_spec_test.go (TestDeleteTruncatedAtValueBoundary, TestDeleteTruncatedMidStructure, TestDeleteTruncatedArrayInput, truncated-escape cases). run_fuzz_campaign.sh 4-pass x 180s saturated, 0 crashes after the bounds-check fixes. No NEW Med+.
research:
    campaign: run_fuzz_campaign.sh (4 passes x 180s/target) driving the Fuzz*Native corpus harnesses, plus boundary regression tests.
    evidence:
        - FuzzTokenStartNative, FuzzDeleteNative, FuzzParseStringNative in fuzz_native_test.go drive the Get/Delete/ParseString surfaces over libFuzzer-generated bytes.
        - Truncation regression in deep_spec_test.go (TestDeleteTruncatedAtValueBoundary, TestDeleteTruncatedMidStructure, TestDeleteTruncatedArrayInput, plus GetString/ParseString truncated-escape cases) pins panic-free degradation at every structural boundary.
    finding: Worst case is truncated JSON at a value/key/structure/element/escape boundary causing nextToken/stringEnd/blockEnd to return -1 whose subsequent data[offset] dereference can panic. Boundary helpers now return a parse error or not-found result and callers bounds-check before indexing. Campaign saturated with zero crashes on this class after the fix; no NEW Med+ product defect.
