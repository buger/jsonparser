stakeholder:
    persona: Go developers reading JSON tokens with minimal allocations
    story: As a Go developer reading JSON byte payloads, I want an unsafe helper that exposes addressed values as raw strings without unescaping so that I can avoid extra allocations when I explicitly accept the tradeoff.
    acceptance_criteria:
        - id: AC-1
          text: A caller can retrieve an addressed JSON value through GetUnsafeString and receive the raw bytes as a Go string without JSON unescaping, including the documented lookup-miss behavior from the underlying path lookup.
          testable: true
          derived_reqs:
            - SYS-REQ-011
            - SYS-REQ-080
            - SYS-REQ-081
            - SYS-REQ-082
            - SYS-REQ-103
            - SYS-REQ-104
            - SYS-REQ-105
    obligation_checklist:
        - determinism
        - edge_case
        - empty_input
        - malformed_input
        - nil_safety
        - nominal
        - truncated_at_value_boundary
    obligation_suppressions:
        - id: denial_of_service_resistant
          reason: Decomposed at SYS-REQ-080 (GetUnsafeString delegates to underlying path lookup) and SYS-REQ-082 (returns raw bytes without unescape work); the helper performs zero-allocation string mapping over a caller-bounded []byte with no extra parsing beyond the path walk.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:44Z"
          framework_refs:
            - CWE CWE-400,CWE-1333
            - MISRA-C Rule 17.2
            - NIST-800-53 SC-5
            - OWASP-ASVS-v4 V11.1.4
        - id: encoding_aware
          reason: GetUnsafeString explicitly opts out of JSON unescaping and returns raw byte content as a string; encoding interpretation is the caller's responsibility (the API name and SYS-REQ-006 documentation make the encoding-passthrough contract explicit).
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:44Z"
          framework_refs:
            - CWE CWE-176,CWE-180,CWE-838
            - MISRA-C Dir 4.14
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: length_prefix_validated
          reason: JSON is a self-delimiting structural format with no length-prefix fields; jsonparser's tokenizer advances by structural state machine, not by trusting a declared byte count.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:07:05Z"
          framework_refs:
            - CWE CWE-130,CWE-805,CWE-119
            - IEC-62304 §5.3.1
            - MISRA-C Rule 21.18
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: malformed_recovers_or_errors_loudly
          reason: Decomposed at SYS-REQ-080 (GetUnsafeString inherits the documented lookup-miss behaviour from the underlying path lookup); malformed input surfaces through the same Get path-walker errors as STK-REQ-001 / SYS-REQ-026 — the unsafe variant adds no new malformed-input failure modes.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:44Z"
          framework_refs:
