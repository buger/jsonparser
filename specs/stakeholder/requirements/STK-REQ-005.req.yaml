stakeholder:
    persona: Go developers mutating dynamic JSON payloads in-place
    story: As a Go developer mutating JSON byte payloads, I want experimental helpers that update or delete addressed values with deterministic edge-case behavior so that I can transform payloads without writing my own low-level mutator.
    acceptance_criteria:
        - id: AC-1
          text: A caller can update an existing addressed JSON value or create a supported missing addressed value through Set and receive the expected mutated payload, or a defined error when the requested mutation path is unusable.
          testable: true
          derived_reqs:
            - SYS-REQ-009
            - SYS-REQ-051
            - SYS-REQ-068
            - SYS-REQ-069
            - SYS-REQ-070
        - id: AC-2
          text: A caller can delete an addressed JSON value through Delete and receive either the expected mutated payload, the unchanged original payload for a missing addressed target in otherwise usable input, or the unchanged original payload for malformed, truncated, or otherwise unusable input, without process crash or panic.
          testable: true
          derived_reqs:
            - SYS-REQ-010
            - SYS-REQ-033
            - SYS-REQ-034
            - SYS-REQ-035
            - SYS-REQ-048
            - SYS-REQ-049
            - SYS-REQ-050
            - SYS-REQ-056
            - SYS-REQ-100
            - SYS-REQ-101
            - SYS-REQ-102
    obligation_checklist:
        - edge_case
        - empty_input
        - error_propagation
        - idempotency
        - malformed_input
        - missing_path
        - nested_mutation
        - nil_safety
        - no_path_provided
        - nominal
        - sentinel_value_boundary
        - truncated_at_value_boundary
        - truncated_mid_structure
    obligation_suppressions:
        - id: denial_of_service_resistant
          reason: Decomposed at SYS-REQ-035 (Delete malformed/truncated input → unchanged payload, no panic), SYS-REQ-051 (Set on truncated input → error rather than corrupt output), SYS-REQ-056 (Delete mid-structure truncated → unchanged); mutation helpers reuse the bounded iterative tokenizer and never panic on adversarial input.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:38Z"
          framework_refs:
            - CWE CWE-400,CWE-1333
            - MISRA-C Rule 17.2
            - NIST-800-53 SC-5
            - OWASP-ASVS-v4 V11.1.4
        - id: encoding_aware
          reason: Set / Delete operate at the byte-level on the caller's []byte payload; they preserve the exact byte encoding of unchanged regions (no transcoding) and Set's caller supplies the replacement byte sequence whose encoding is the caller's responsibility.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:38Z"
          framework_refs:
            - CWE CWE-176,CWE-180,CWE-838
            - MISRA-C Dir 4.14
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: length_prefix_validated
          reason: JSON is a self-delimiting structural format with no length-prefix fields; jsonparser's tokenizer advances by structural state machine, not by trusting a declared byte count.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:07:04Z"
          framework_refs:
            - CWE CWE-130,CWE-805,CWE-119
            - IEC-62304 §5.3.1
            - MISRA-C Rule 21.18
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: malformed_recovers_or_errors_loudly
          reason: Decomposed at SYS-REQ-035 (Delete on malformed input → original payload unchanged, no panic — documented best-effort recovery), SYS-REQ-051 (Set on truncated input → explicit error rather than corrupt output); the recovery-vs-error policy is documented per-operation.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:38Z"
          framework_refs:
            - CWE CWE-20,CWE-755
            - IEC-62304 §5.3.1
