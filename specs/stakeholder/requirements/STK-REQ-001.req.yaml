stakeholder:
    persona: Go developers consuming dynamic JSON payloads
    story: As a Go developer consuming unpredictable JSON APIs, I want to retrieve nested values by key path without predeclaring structs so that I can process payloads directly from byte slices.
    acceptance_criteria:
        - id: AC-1
          text: A caller can request a nested value by path from a JSON byte slice and receive the correct value, not-found result, or parsing error for the addressed input case.
