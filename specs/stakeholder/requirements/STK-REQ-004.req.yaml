stakeholder:
    persona: Go developers traversing dynamic JSON structures
    story: As a Go developer inspecting dynamic JSON payloads, I want traversal helpers that iterate arrays and objects and resolve multiple paths in one scan so that I can process payloads without writing custom walkers.
    acceptance_criteria:
        - id: AC-1
          text: A caller can iterate an addressed JSON array in encounter order, receive no callbacks for a well-formed empty addressed array, and receive an error for malformed or otherwise unusable array input.
          testable: true
          derived_reqs:
            - SYS-REQ-006
            - SYS-REQ-028
            - SYS-REQ-029
            - SYS-REQ-052
            - SYS-REQ-053
            - SYS-REQ-055
            - SYS-REQ-083
        - id: AC-2
          text: A caller can iterate an addressed JSON object and receive the correct key, value, and value type tuples for well-formed entries, no entries for well-formed empty objects, propagated callback errors, and an error for malformed or otherwise unusable object input.
          testable: true
          derived_reqs:
            - SYS-REQ-007
            - SYS-REQ-030
            - SYS-REQ-031
            - SYS-REQ-032
            - SYS-REQ-054
            - SYS-REQ-084
        - id: AC-3
          text: A caller can request multiple key paths from one payload scan and receive the correct found or missing-path behavior for each requested path.
          testable: true
          derived_reqs:
            - SYS-REQ-008
            - SYS-REQ-085
            - SYS-REQ-097
            - SYS-REQ-098
            - SYS-REQ-099
    obligation_checklist:
        - callback_error_propagation
        - determinism
        - edge_case
        - empty_input
        - malformed_input
        - nil_safety
        - nominal
        - sentinel_value_boundary
        - truncated_at_value_boundary
        - truncated_mid_element
        - truncated_mid_structure
    obligation_suppressions:
        - id: denial_of_service_resistant
          reason: Decomposed at SYS-REQ-029 (ArrayEach malformed input → error), SYS-REQ-031 (ObjectEach malformed input → error), SYS-REQ-053/054 (truncated mid-element handling); traversal helpers iterate via the bounded iterative tokenizer and emit at most one callback per element.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:32Z"
          framework_refs:
            - CWE CWE-400,CWE-1333
            - MISRA-C Rule 17.2
            - NIST-800-53 SC-5
            - OWASP-ASVS-v4 V11.1.4
        - id: encoding_aware
          reason: ArrayEach / ObjectEach pass raw value byte slices to the caller without decoding; encoding correctness is delegated to the caller-chosen accessor (GetString covered by STK-REQ-002 / SYS-REQ-073) which the callback typically invokes for string fields.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:32Z"
          framework_refs:
            - CWE CWE-176,CWE-180,CWE-838
            - MISRA-C Dir 4.14
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: length_prefix_validated
          reason: JSON is a self-delimiting structural format with no length-prefix fields; jsonparser's tokenizer advances by structural state machine, not by trusting a declared byte count.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:06:57Z"
          framework_refs:
            - CWE CWE-130,CWE-805,CWE-119
            - IEC-62304 §5.3.1
            - MISRA-C Rule 21.18
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.1.4
        - id: malformed_recovers_or_errors_loudly
          reason: Decomposed at SYS-REQ-029 (ArrayEach malformed → error), SYS-REQ-031 (ObjectEach malformed → error), SYS-REQ-053 (array element truncated → error), SYS-REQ-054 (object entry truncated → error); the traversal helpers fail-loud on malformed structure rather than swallowing partial state.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:32Z"
          framework_refs:
            - CWE CWE-20,CWE-755
            - IEC-62304 §5.3.1
            - MISRA-C Dir 4.14
            - NIST-800-53 SI-10,SI-11
            - OWASP-ASVS-v4 V5.1.3,V5.5.3
        - id: polymorphic_type_whitelist
          reason: jsonparser exposes raw byte slices and JSON token types; it never instantiates Go types from a discriminator field, so no polymorphic deserialization attack surface exists in the API.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:06:58Z"
          framework_refs:
            - CWE CWE-502,CWE-915
            - IEC-62304 §5.3.1
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.5.1,V5.5.2
        - id: recursion_depth_bounded
          reason: ArrayEach / ObjectEach iterate one structural level via the iterative tokenizer; for nested traversal the caller invokes ArrayEach again from inside its callback, so depth bound is the caller's call-stack rather than a parser-internal recursion — the parser itself does not native-recurse on JSON nesting.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:33Z"
          framework_refs:
            - CWE CWE-674,CWE-400
            - IEC-62304 §5.3.1
            - MISRA-C Rule 17.2
            - NIST-800-53 SC-5
            - OWASP-ASVS-v4 V5.5.3
        - id: reference_cycle_safe
          reason: JSON RFC 8259 has no reference or alias syntax; cycles cannot exist in a well-formed JSON document and jsonparser does not perform any $ref or anchor expansion.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:06:58Z"
          framework_refs:
            - CWE CWE-674,CWE-1325
            - MISRA-C Dir 4.14
            - NIST-800-53 SC-5
            - OWASP-ASVS-v4 V5.5.3
        - id: untrusted_input_bounded
          reason: Traversal helpers expose raw value byte slices; no Go-type instantiation from input occurs and the input []byte is caller-bounded; deserializer-style schema enforcement is delegated to the caller's typed accessor selection.
          suppressed_by: leonidbugaev
          suppressed_at: "2026-05-03T10:14:33Z"
          framework_refs:
            - CWE CWE-502,CWE-20
            - IEC-62304 §5.3.1
            - MISRA-C Dir 4.14
            - NIST-800-53 SI-10
            - OWASP-ASVS-v4 V5.5.1,V5.5.3
