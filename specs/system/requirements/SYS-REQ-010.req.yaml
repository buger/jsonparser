obligation_hazards:
    - class: empty_input
      worst_case: Delete with no path returns a non-empty document instead of an empty one, leaking data the caller explicitly asked to erase.
      severity: low
    - class: malformed_input
      worst_case: Delete on a well-formed array/object with whitespace between the deleted element and the trailing comma (or the close bracket) leaves a dangling comma or close-bracket sequence in the output, producing malformed JSON the caller cannot re-parse (DEFECT-260726-3PSJ, found by FuzzPathMutation).
      severity: high
    - class: nil_safety
      worst_case: Delete on nil data panics in nextToken at data[0] instead of returning the empty document, crashing the caller on a nil trust-boundary input.
      severity: high
