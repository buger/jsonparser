obligation_hazards:
    - class: malformed_input
      worst_case: ArrayEach on adversarial input like [1,{ drives nextToken past EOF; an unguarded i+1 increment in the iteration loop panics with index-out-of-range on network-reachable input.
      severity: critical
    - class: non_array_root_no_callback
      worst_case: ArrayEach on a non-array root value (object, number, bool, null) without a key path invoked the callback ONCE with the first content token misinterpreted as an array element (e.g. an object key parsed as a string element), then returned MalformedArrayError. A caller performing side effects in the callback observed a spurious invocation on input that is not an array at all. Fixed in DEFECT-260727-ARR1; regression test TestArrayEachNonArrayRootNoCallback_SYS029 locks all non-array root type partitions.
      severity: medium
nominal_evidence_exemptions:
    - obligation_class: non_array_root_no_callback
      reason: 'SYS-REQ-029 models ONLY a failure/rejection outcome (malformed_array_input_returns_error); there is no valid-input success outcome to witness nominally. The non_array_root_no_callback obligation is a negative contract: the callback must NOT fire on non-array input. The adversarial witness TestArrayEachNonArrayRootNoCallback_SYS029 (annotated SYS-REQ-029:non_array_root_no_callback:negative) is the canonical evidence shape — a nominal witness would require a valid-input happy-path that does not exist in this requirement''s scope.'
