obligation_hazards:
    - class: edge_case
      worst_case: ParseInt on a leading-zero canonical token like 007 returns 7 with the leading zeros stripped inconsistently, or off-by-one on a single-digit 0 token, producing wrong results for canonical-form inputs.
      severity: low
    - class: malformed_input
      worst_case: ParseInt on a sign-only token ("-") returns (0, nil) — silent false-success — instead of MalformedValueError, masking malformed input as a valid zero (DEFECT-260726-3F95 / KI-2).
      severity: low
    - class: nil_safety
      worst_case: ParseInt on a nil slice panics with index-out-of-range at data[0] in the first-byte classification instead of returning MalformedValueError.
      severity: high
