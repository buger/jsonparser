obligation_hazards:
    - class: nominal
      worst_case: ReaderParser returns a different value or ValueType than the byte-slice parser for the same path because incremental matching loses nesting or quote state at a read boundary.
      severity: medium
    - class: boundary
      worst_case: A key, escape sequence, scalar, string, or composite value crossing the sliding-window boundary is truncated, duplicated, or skipped, returning corrupt value bytes or retaining the whole stream.
      severity: medium
    - class: empty_input
      worst_case: An empty or nil reader causes a panic or an unbounded read loop instead of returning the defined not-found or malformed-input result.
      severity: medium
    - class: malformed_input
      worst_case: A truncated string, array, or object is treated as complete and yielded to the caller, or the parser loops forever waiting for a delimiter after stream EOF.
      severity: high
