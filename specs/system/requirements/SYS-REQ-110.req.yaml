obligation_delegations:
    - class: boundary
      delegated_to: SYS-REQ-009
      reason: SYS-REQ-110 is a leaf contract partition; the boundary implementation lives in parser.go:Set / parser.go:createInsertComponent which SYS-REQ-009 already carries implemented_by traces for (source_native autolink). Delegating avoids weakening SYS-REQ-110 by removing the obligation.
      delegated_by: human:buger
      delegated_at: "2026-07-26T18:09:59Z"
obligation_hazards:
    - class: boundary
      worst_case: Set on [len(array)] or beyond silently overwrites element 0 (or another existing element the caller did not address), destroying data and returning a mutated document with no error — silent corruption of unaddressed state.
      severity: high
    - class: nested_mutation
      worst_case: Set on a beyond-length array index inside a nested container drives createInsertComponent to emit array scaffolding at the wrong offset; a regression overwrites a sibling element or builds malformed JSON, silently corrupting the nested structure.
      severity: medium
    - class: element_type_partition
      worst_case: Set on a beyond-length array index under a nested key whose existing array contains SCALAR first elements (numbers, strings, bools, nulls, nested arrays — anything where the first element byte is not '{') silently replaces the entire array with a single-element [value], destroying all existing data. The append-at-end code path's guard previously required data[subObjOff]=='{' , so only object-first-element arrays took the append branch; scalar arrays fell through to the replace-container branch. Fixed in DEFECT-260727-WWWY; regression test TestSetBeyondLengthScalarArrayPreservesElements_SYS110 locks all scalar element-type partitions.
      severity: high
