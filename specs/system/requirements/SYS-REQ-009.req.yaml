      reason: 'SYS-REQ-009 models Set''s general mutation contract; the array-index boundary success path (append-at-end beyond length) is decomposed to SYS-REQ-110, which carries the SYS-REQ-110:boundary:nominal witness. SYS-REQ-009''s own FRETish has no boundary-domain valid-input success outcome to witness nominally.'
