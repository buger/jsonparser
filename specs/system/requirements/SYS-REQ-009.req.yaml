id: SYS-REQ-009
version: 1
status: approved
priority: shall
category: functional
req_type: guarantee
fretish: the parser shall always satisfy !set_path_is_provided | set_target_exists | set_creates_missing_path | set_returns_updated_document | set_returns_not_found_error
description: 'When Set is called with a provided path, the parser shall either replace the existing addressed value, create a type-consistent missing path and return the updated JSON document, or return KeyPathNotFoundError when the requested mutation path is not usable for the provided input. ''Type-consistent'' means each path segment''s kind matches its resolved parent container: object-key segments under object parents, array-index [N] segments under array parents. A path component whose kind mismatches its parent (e.g. [N] under an object, or an object-key under an array at a depth where the parent must be inferred) is ''not usable for the provided input'' and shall surface KeyPathNotFoundError. (Cross-type mismatch currently produces malformed JSON output instead — tracked as DEFECT-260726-MFPA / KI-3.)'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
component: parser
rationale: Set is the documented experimental mutation helper and must preserve defined behavior for addressed path updates and invalid mutation inputs.
